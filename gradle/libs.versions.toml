[versions]
jackson = "2.22.4"
jspecify = "1.0.1"
errorprone = "2.51.0"
nullaway = "0.14.3"
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.1"
swaggerRequestValidator = "2.46.1"
checkstyle = "14.3.0"
jacoco = "0.8.15"
palantirJavaFormat = "2.102.0"
spring = "7.0.10"

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
swagger-request-validator-core = { module = "com.atlassian.oai:swagger-request-validator-core", version.ref = "swaggerRequestValidator" }
spring-web = { module = "org.springframework:spring-web", version.ref = "spring" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring" }

[plugins]
spotless = { id = "com.diffplug.spotless", version = "8.10.4" }
errorprone = { id = "net.ltgt.errorprone", version = "5.1.1" }
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
japicmp = { id = "me.champeau.gradle.japicmp", version = "0.4.6" }
cyclonedx = { id = "org.cyclonedx.bom", version = "3.5.1" }

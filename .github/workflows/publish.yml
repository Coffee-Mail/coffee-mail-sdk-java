name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v6

      - name: Gates de qualidade e versão
        run: ./gradlew check verifyVersionSync -PreleaseTag="${GITHUB_REF_NAME}"

      - name: Smoke test do artefato (module path e classpath)
        run: |
          ./gradlew publishToMavenLocal
          ./gradlew -p smoke-test run -Pmodular=true -PsdkVersion="${GITHUB_REF_NAME#v}"
          ./gradlew -p smoke-test run -Pmodular=false -PsdkVersion="${GITHUB_REF_NAME#v}"

      - name: Publicar no Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Gerar SBOM
        run: ./gradlew :cyclonedxDirectBom --no-configuration-cache

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/libs/coffeemail-java-*.jar

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            build/libs/coffeemail-java-*.jar \
            build/reports/cyclonedx-direct/bom.json
